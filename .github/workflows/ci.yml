# Quality gates of docs/TESTING.md §3, run in the reference container (tools/docker/Dockerfile).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The test jobs run inside the image published to GHCR by the "image" job: pulling it needs
# packages: read.
permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the reference image once per Dockerfile revision and publishes it to GHCR, tagged with
  # the hash of the Dockerfile; later runs reuse it.
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/nonogram-dev:${{ hashFiles('tools/docker/Dockerfile') }}" >> "$GITHUB_OUTPUT"
      - name: Build and push if missing
        env:
          IMAGE: ${{ steps.tag.outputs.name }}
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Reusing $IMAGE"
          else
            docker build -t "$IMAGE" tools/docker
            docker push "$IMAGE"
          fi

  lint:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: G0 formatting, G2 static analysis
        run: ./scripts/check.sh --only G0,G2

  build-test:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: dev, compiler: gcc-14 }
          - { preset: dev-clang, compiler: clang-20 }
          # Minimum supported Clang (ADR-0001).
          - { preset: dev-clang, compiler: clang-19 }
    name: build-test (${{ matrix.compiler }})
    steps:
      - uses: actions/checkout@v4
      - name: G1 build without warnings
        run: |
          cmake --preset ${{ matrix.preset }} -D CMAKE_C_COMPILER=${{ matrix.compiler }}
          cmake --build --preset ${{ matrix.preset }}
      - name: G3 unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit
      - name: G3 exhaustive tests
        run: ctest --preset ${{ matrix.preset }} -L exhaustive
      - name: G4 integration tests
        run: ctest --preset ${{ matrix.preset }} -L integration
      - name: G5 property tests
        run: ctest --preset ${{ matrix.preset }} -L property

  sanitizers:
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: G6 ASan + LSan, UBSan + integer
        run: ./scripts/check.sh --only G6

  # The whole of scripts/check.sh (G0 to G10) in the reference container, as a developer runs it
  # before a review: this is where the gates without a dedicated job (Valgrind, coverage, quick
  # fuzzing) run in CI.
  full-check:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: check.sh (G0 to G10; G10 is a SKIP here, the bench job replaces it)
        run: ./scripts/check.sh

  # G10 in CI (TESTING.md §5): a shared runner is not the machine of any baseline, so the job
  # measures the base of the PR and the PR on the same runner, with the corpus of the PR. A peak
  # memory regression above 10 % fails the job (the peak is deterministic); time regressions and
  # changed counters only go to the job summary (runner noise, TESTING.md §4.8). Decision of the
  # project owner, 2026-10-31.
  bench:
    if: github.event_name == 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the PR and its base (preset release)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git worktree add --detach ../base "$BASE_SHA"
          cmake --preset release > /dev/null
          cmake --build --preset release --target nonogram
          cmake -S ../base --preset release > /dev/null
          cmake --build ../base/build/release --target nonogram
      - name: G10 compare the PR with its base
        run: |
          ../base/build/release/src/cli/nonogram bench bench/corpus/tiny/*.non --format json \
            > bench-base.json
          build/release/src/cli/nonogram bench bench/corpus/tiny/*.non --format json \
            > bench-pr.json
          code=0
          python3 scripts/bench_compare.py bench-base.json bench-pr.json --time-mode report \
            > bench-compare.txt || code=$?
          cat bench-compare.txt
          {
            echo '### G10: benchmarks of the PR against its base (same runner)'
            echo '```'
            cat bench-compare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
